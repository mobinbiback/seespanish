<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E2E33">
<link rel="manifest" href="manifest.json">
<title>seespanish · دیکته و شنیداری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --paper: #F7F3E8; --paper-2: #EFE9D6; --graphite: #2E2E33; --graphite-soft: #6B6B73;
    --pencil: #F2C230; --ok: #CDE8C4; --bad: #F4C7C7; --line: #D6CEB4; --shadow: rgba(46,46,51,.18);
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif; --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--body); color: var(--graphite); background: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
    background-size: 100% 32px; background-attachment: fixed; line-height: 1.9; min-height: 100vh;
  }
  :focus-visible { outline: 3px dashed var(--pencil); outline-offset: 4px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    border-bottom: 2px solid var(--graphite); padding-bottom: 12px; margin-bottom: 22px; }
  .logo { font-family: "Caveat", cursive; font-size: 2.8rem; font-weight: 700; margin: 0; line-height: 1; }
  .logo span { background: linear-gradient(transparent 62%, var(--pencil) 62%, var(--pencil) 92%, transparent 92%); padding: 0 4px; }
  .nav a { font-family: var(--head); font-size: 1.4rem; color: var(--graphite); border-bottom: 2px dashed var(--graphite); text-decoration: none; margin-right: 14px; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 0 0 20px; }
  .levels button {
    font-family: var(--head); font-size: 1.5rem; font-weight: 700; color: var(--graphite);
    background: #fff; border: 2px solid var(--graphite); min-height: 44px;
    border-radius: 255px 18px 225px 15px / 15px 225px 15px 255px;
    padding: 4px 18px 2px; cursor: pointer; box-shadow: 3px 3px 0 var(--graphite);
  }
  .levels button[aria-pressed="true"] { background: var(--pencil); }
  .card { background: #fff; border: 2px solid var(--graphite); border-radius: 14px 6px 16px 8px;
    box-shadow: 6px 7px 0 var(--shadow); padding: 24px 22px; text-align: center; margin-bottom: 18px; }
  .btn {
    font-family: var(--head); font-size: 1.35rem; color: var(--graphite); background: var(--paper-2);
    border: 2px solid var(--graphite); padding: 2px 16px; min-height: 44px; cursor: pointer; margin: 6px 4px 0;
    border-radius: 255px 12px 220px 10px / 10px 220px 12px 255px; box-shadow: 3px 3px 0 var(--graphite);
  }
  .btn.main { background: var(--pencil); }
  input[type="text"] { font: inherit; font-size: 1.15rem; width: 100%; max-width: 480px; padding: 10px 12px; min-height: 44px;
    border: 2px solid var(--graphite); border-radius: 8px; direction: ltr; text-align: left; margin-top: 10px; }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 2px dashed var(--graphite); }
  .result.ok { background: var(--ok); }
  .result.bad { background: var(--bad); }
  .sentence { font-family: var(--head); font-size: 1.6rem; direction: ltr; margin: 6px 0; }
  .muted { color: var(--graphite-soft); font-size: .95rem; text-align: center; }
  .score { text-align: center; color: var(--graphite-soft); font-size: .95rem; margin-top: 8px; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: none; justify-content: space-around; gap: 6px;
    background: #fff; border-top: 2px solid var(--graphite); padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 50; }
  .tabbar a { font-family: var(--head); font-size: 1.25rem; color: var(--graphite); text-decoration: none; padding: 6px 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; }
  .tabbar a[aria-current="page"] { background: var(--pencil); border: 2px solid var(--graphite); }
  @media (max-width: 640px) { .tabbar { display: flex; } body { padding-bottom: 84px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><span class="fx-spotlight">seespanish</span></h1>
    <nav class="nav"><a href="index.html">خانه</a><a href="practice.html">تمرین</a><a href="memory.html">مرور</a></nav>
  </header>

  <p class="muted">یک جمله را گوش کن و همان را بنویس. تلفظ با صدای خود مرورگر است.</p>
  <ul class="levels" id="levels" role="group" aria-label="انتخاب سطح"></ul>

  <div class="card">
    <button class="btn main" id="play" type="button">پخش جمله</button>
    <button class="btn" id="slow" type="button">پخش آهسته</button>
    <div>
      <input type="text" id="answer" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="آنچه شنیدی را بنویس">
    </div>
    <div>
      <button class="btn main" id="check" type="button">بررسی</button>
      <button class="btn" id="next" type="button">جمله‌ی بعدی</button>
    </div>
    <div class="result" id="result" hidden></div>
  </div>
  <p class="score" id="score"></p>
  <p class="muted" id="unsupported" hidden>این مرورگر صدا پخش نمی‌کند. می‌توانی متن جمله را بخوانی و تایپ کنی.</p>
</div>

<script src="data/practice.js"></script>
<script src="data/practice-more.js"></script>
<script src="data/vocab-more.js"></script>
<script src="data/vocab-b1.js"></script>
<script src="data/vocab-b2.js"></script>
<script src="data/vocab-c1.js"></script>
<script src="data/vocab-c2.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
  let level = "A1";
  let current = null;
  let right = 0, total = 0;

  // نرمال‌سازی: بدون accent، بدون علامت نگارشی، حروف کوچک، فاصله‌ی یکنواخت
  const clean = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[.,;:!?¡¿"'«»()\-]/g, " ").replace(/\s+/g, " ").trim();

  function sentences() {
    return (window.SEE_PRACTICE.vocab[level] || []).filter((v) => v.ex).map((v) => v.ex);
  }

  function speak(text, rate) {
    if (!("speechSynthesis" in window)) { $("#unsupported").hidden = false; return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    u.rate = rate;
    window.speechSynthesis.speak(u);
  }

  function pick() {
    const list = sentences();
    if (!list.length) { current = null; return; }
    current = list[Math.floor(Math.random() * list.length)];
    $("#answer").value = "";
    $("#result").hidden = true;
    speak(current, 0.9);
  }

  function renderLevels() {
    const ul = $("#levels");
    ul.innerHTML = "";
    LEVELS.forEach((lvl) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = lvl;
      b.setAttribute("aria-pressed", String(lvl === level));
      b.addEventListener("click", () => { level = lvl; right = 0; total = 0; renderScore(); renderLevels(); pick(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function renderScore() {
    $("#score").textContent = total ? `درست: ${right} از ${total}` : "";
  }

  $("#play").addEventListener("click", () => current && speak(current, 0.9));
  $("#slow").addEventListener("click", () => current && speak(current, 0.6));
  $("#next").addEventListener("click", pick);
  $("#answer").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#check").click(); });

  $("#check").addEventListener("click", () => {
    if (!current) return;
    const typed = $("#answer").value;
    if (!typed.trim()) return;
    const ok = clean(typed) === clean(current);
    total += 1;
    if (ok) right += 1;
    renderScore();
    const box = $("#result");
    box.className = "result " + (ok ? "ok" : "bad");
    box.innerHTML = "";
    const h = document.createElement("p");
    h.textContent = ok ? "درست بود" : "این جمله بود:";
    const s = document.createElement("p");
    s.className = "sentence";
    s.textContent = current;
    s.dir = "ltr";
    box.append(h);
    if (!ok) box.append(s);
    else box.append(s);
    box.hidden = false;
  });

  renderLevels();
  pick();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
<nav class="tabbar" aria-label="منوی پایین"><a href="index.html">خانه</a><a href="memory.html">مرور</a><a href="practice.html">تمرین</a><a href="exams.html">امتحان</a></nav>
</body>
</html>
