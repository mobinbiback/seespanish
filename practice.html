<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E2E33">
<link rel="manifest" href="manifest.json">
<title>seespanish · تمرین امتحان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --paper: #F7F3E8; --paper-2: #EFE9D6; --graphite: #2E2E33; --graphite-soft: #6B6B73;
    --pencil: #F2C230; --ok: #CDE8C4; --bad: #F4C7C7; --line: #D6CEB4; --shadow: rgba(46,46,51,.18);
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif; --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--body); color: var(--graphite); background: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
    background-size: 100% 32px; background-attachment: fixed; line-height: 1.9; min-height: 100vh;
  }
  :focus-visible { outline: 3px dashed var(--pencil); outline-offset: 4px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    border-bottom: 2px solid var(--graphite); padding-bottom: 12px; margin-bottom: 22px; }
  .logo { font-family: "Caveat", cursive; font-size: 2.8rem; font-weight: 700; margin: 0; line-height: 1; }
  .logo span { background: linear-gradient(transparent 62%, var(--pencil) 62%, var(--pencil) 92%, transparent 92%); padding: 0 4px; }
  .nav a { font-family: var(--head); font-size: 1.4rem; color: var(--graphite); border-bottom: 2px dashed var(--graphite); text-decoration: none; margin-right: 14px; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 0 0 20px; }
  .levels button {
    font-family: var(--head); font-size: 1.5rem; font-weight: 700; color: var(--graphite);
    background: #fff; border: 2px solid var(--graphite);
    border-radius: 255px 18px 225px 15px / 15px 225px 15px 255px;
    padding: 4px 18px 2px; cursor: pointer; box-shadow: 3px 3px 0 var(--graphite);
  }
  .levels button[aria-pressed="true"] { background: var(--pencil); }
  .card { background: #fff; border: 2px solid var(--graphite); border-radius: 12px 5px 14px 7px;
    padding: 20px 22px; box-shadow: 5px 6px 0 var(--shadow); margin-bottom: 22px; }
  .badge { display: inline-block; font-family: var(--head); font-size: 1.15rem; background: var(--paper-2);
    border: 1.5px solid var(--graphite); padding: 0 10px; border-radius: 255px 12px 220px 10px / 10px 220px 12px 255px; margin-bottom: 8px; }
  .prompt { background: var(--paper-2); border-radius: 8px; padding: 10px 14px; margin: 8px 0 12px; }
  .question { font-weight: 800; margin: 6px 0; }
  .opts { list-style: none; padding: 0; margin: 8px 0; }
  .opts li { margin: 6px 0; }
  .opts label { cursor: pointer; }
  input[type="text"] { font: inherit; padding: 6px 10px; border: 2px solid var(--graphite); border-radius: 6px; width: 260px; max-width: 100%; }
  textarea { font: inherit; width: 100%; min-height: 140px; padding: 10px; border: 2px solid var(--graphite); border-radius: 8px; background: #fff; }
  .count { font-size: .9rem; color: var(--graphite-soft); }
  button.act {
    font-family: var(--head); font-size: 1.35rem; color: var(--graphite); background: var(--pencil);
    border: 2px solid var(--graphite); border-radius: 255px 12px 220px 10px / 10px 220px 12px 255px;
    padding: 2px 18px; cursor: pointer; box-shadow: 3px 3px 0 var(--graphite); margin-top: 8px;
  }
  .result { margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 2px dashed var(--graphite); }
  .result.ok { background: var(--ok); }
  .result.bad { background: var(--bad); }
  .result h4 { font-family: var(--head); font-size: 1.5rem; margin: 0 0 4px; }
  .study h5 { font-family: var(--head); font-size: 1.3rem; margin: 12px 0 4px; }
  .gcard { border-bottom: 1px dashed var(--line); padding: 6px 0; }
  .gcard:last-child { border-bottom: 0; }
  .gcard b { font-weight: 800; }
  .gcard small { color: var(--graphite-soft); display: block; }
  .stars { font-family: var(--head); font-size: 1.1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: .95rem; background: #fff; border: 1.5px solid var(--graphite); border-radius: 255px 12px 220px 10px / 10px 220px 12px 255px; padding: 0 10px; }
  .checklist li { list-style: none; margin: 4px 0; }
  details.explain { margin-top: 6px; }
  details.explain summary { cursor: pointer; font-family: var(--head); font-size: 1.15rem; border-bottom: 1.5px dashed var(--graphite); display: inline-block; }
  .explain-body { white-space: pre-line; margin-top: 6px; padding: 8px 10px; background: var(--paper-2); border-radius: 8px; font-size: .92rem; }
  .checklist { padding: 0; }
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .vocab-grid div { background: #fff; border: 1.5px solid var(--graphite); border-radius: 8px; padding: 8px 10px; }
  .vocab-grid b { display: block; }
  .muted { color: var(--graphite-soft); font-size: .92rem; }
  h2 { font-family: var(--head); font-size: 2rem; margin: 26px 0 8px; }
  footer { margin-top: 30px; font-size: .9rem; color: var(--graphite-soft); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: none; justify-content: space-around; gap: 6px;
    background: #fff; border-top: 2px solid var(--graphite); padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 50; }
  .tabbar a { font-family: var(--head); font-size: 1.25rem; color: var(--graphite); text-decoration: none; padding: 6px 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; }
  .tabbar a[aria-current="page"] { background: var(--pencil); border: 2px solid var(--graphite); }
  @media (max-width: 640px) { .tabbar { display: flex; } body { padding-bottom: 84px; } }
</style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="logo">see<span>spanish</span></h1>
    <nav class="nav"><a href="index.html">گرامرها</a><a href="dictation.html">دیکته</a><a href="memory.html">مرور واژگان</a><a href="exams.html">امتحان‌ها</a></nav>
  </header>

  <p class="muted">سؤال‌ها به سبک DELE و SIELE نوشته شده‌اند ولی سؤال رسمی نیستند. بعد از هر جواب، تحلیل و گرامر و واژه‌های مرتبط را می‌بینی.</p>

  <ul class="levels" id="levels" role="group" aria-label="انتخاب سطح"></ul>

  <div id="items"></div>

  <h2>واژگان این سطح</h2>
  <div class="card"><div class="vocab-grid" id="vocab"></div></div>

  <footer>پاسخ‌ها و پیشرفت فقط در همین صفحه بررسی می‌شوند و در جای دیگری ذخیره نمی‌شوند.</footer>
</div>

<script src="data/data.js"></script>
<script src="data/explain.js"></script>
<script src="data/explain-b1.js"></script>
<script src="data/explain-b2.js"></script>
<script src="data/explain-c1.js"></script>
<script src="data/explain-c2.js"></script>
<script src="data/practice.js"></script>
<script src="data/practice-extra.js"></script>
<script src="data/practice-b1.js"></script>
<script src="data/practice-b2.js"></script>
<script src="data/practice-more.js"></script>
<script src="data/progress.js"></script>
<script src="data/vocab-more.js"></script>
<script src="data/vocab-b1.js"></script>
<script src="data/vocab-b2.js"></script>
<script src="data/vocab-c1.js"></script>
<script src="data/vocab-c2.js"></script>
<script>
  const G = window.SEE;
  const P = window.SEE_PRACTICE;
  let current = "A1";

  const $ = (s) => document.querySelector(s);
  const norm = (t) => t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  function grammarById(id) {
    for (const l of G.levels) for (const it of G.grammar[l]) if (it.id === id) return it;
    return null;
  }

  function studyBlock(it) {
    const gs = (it.grammar || []).map(grammarById).filter(Boolean).map((g) => `
      <div class="gcard">
        <b dir="auto">${g.title}</b>
        <span class="stars">${"★".repeat(g.stars)}${"☆".repeat(3 - g.stars)}</span>
        <small>${g.note}</small>
        ${(window.SEE_EXPLAIN || {})[g.id] ? `<details class="explain"><summary>توضیح کامل</summary><div class="explain-body">${(window.SEE_EXPLAIN[g.id]).replace(/</g, "&lt;")}</div></details>` : ""}
      </div>`).join("");
    const vs = (it.vocab || []).map((v) => {
      const hit = (P.vocab[it.level] || []).find((x) => x.es === v);
      return `<span class="chip"><span dir="ltr">${v}</span>${hit ? " · " + hit.fa : ""}</span>`;
    }).join("");
    return `
      <div class="study">
        <h5>گرامری که باید بخوانی</h5>
        ${gs || '<p class="muted">برای این سؤال گرامر جدا ثبت نشده است.</p>'}
        <h5>کلمه‌هایی که باید بخوانی</h5>
        <div class="chips">${vs}</div>
      </div>`;
  }

  function renderLevels() {
    const ul = $("#levels");
    ul.innerHTML = "";
    G.levels.forEach((lvl) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = lvl;
      b.setAttribute("aria-pressed", String(lvl === current));
      b.addEventListener("click", () => { current = lvl; renderLevels(); renderItems(); renderVocab(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function renderItems() {
    const box = $("#items");
    box.innerHTML = "";
    const weakOnly = new URLSearchParams(location.search).get("weak") === "1";
    const weak = window.SEE_PROGRESS.weakIds();
    const list = weakOnly
      ? P.items.filter((i) => weak.includes(i.id))
      : P.items.filter((i) => i.level === current);
    if (weakOnly && !list.length) box.innerHTML = `<p class="muted">نقطه‌ضعفی ثبت نشده است. اول چند تمرین را حل کن.</p>`;
    list.forEach((it) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<span class="badge">${it.level} · ${it.skill}</span>
        <div class="prompt" dir="ltr">${it.prompt}</div>
        <div class="question" dir="ltr">${it.question || ""}</div>
        <div class="body"></div>
        <div class="feedback"></div>`;
      box.appendChild(card);
      const body = card.querySelector(".body");
      const fb = card.querySelector(".feedback");

      if (it.type === "mcq") {
        const ul = document.createElement("ul");
        ul.className = "opts";
        it.options.forEach((opt, idx) => {
          const li = document.createElement("li");
          li.innerHTML = `<label><input type="radio" name="${it.id}" value="${idx}"> <span dir="ltr">${opt}</span></label>`;
          ul.appendChild(li);
        });
        body.appendChild(ul);
        const btn = document.createElement("button");
        btn.className = "act"; btn.type = "button"; btn.textContent = "بررسی جواب";
        btn.addEventListener("click", () => {
          const sel = card.querySelector(`input[name="${it.id}"]:checked`);
          if (!sel) { fb.innerHTML = `<p class="muted">اول یک گزینه را انتخاب کن.</p>`; return; }
          const ok = Number(sel.value) === it.answer;
          window.SEE_PROGRESS.recordAnswer(it.id, ok);
          fb.innerHTML = `<div class="result ${ok ? "ok" : "bad"}">
            <h4>${ok ? "درست است" : "پاسخ درست: " + it.options[it.answer]}</h4>
            <p>${it.analysis}</p>${studyBlock(it)}</div>`;
        });
        body.appendChild(btn);
      } else if (it.type === "fill") {
        const input = document.createElement("input");
        input.type = "text"; input.placeholder = "جواب را بنویس"; input.dir = "ltr";
        body.appendChild(input);
        const btn = document.createElement("button");
        btn.className = "act"; btn.type = "button"; btn.textContent = "بررسی جواب";
        btn.addEventListener("click", () => {
          const ok = it.accept.map(norm).includes(norm(input.value));
          window.SEE_PROGRESS.recordAnswer(it.id, ok);
          fb.innerHTML = `<div class="result ${ok ? "ok" : "bad"}">
            <h4>${ok ? "درست است" : "پاسخ درست: " + it.answer}</h4>
            <p>${it.analysis}</p>${studyBlock(it)}</div>`;
        });
        body.appendChild(btn);
      } else if (it.type === "writing") {
        const ta = document.createElement("textarea");
        ta.dir = "ltr";
        const cnt = document.createElement("p");
        cnt.className = "count";
        const words = () => (ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0);
        const update = () => { cnt.textContent = `${words()} کلمه (هدف: ${it.minWords} تا ${it.maxWords})`; };
        ta.addEventListener("input", update); update();
        body.append(ta, cnt);

        const list = document.createElement("ul");
        list.className = "checklist";
        it.checklist.forEach((c, idx) => {
          const li = document.createElement("li");
          li.innerHTML = `<label><input type="checkbox" data-idx="${idx}"> ${c}</label>`;
          list.appendChild(li);
        });
        body.appendChild(list);

        const btn = document.createElement("button");
        btn.className = "act"; btn.type = "button"; btn.textContent = "ارزیابی متن";
        btn.addEventListener("click", () => {
          const n = words();
          const checked = body.querySelectorAll("input[type=checkbox]:checked").length;
          const inRange = n >= it.minWords && n <= it.maxWords;
          const ok = inRange && checked === it.checklist.length;
          window.SEE_PROGRESS.recordAnswer(it.id, ok);
          fb.innerHTML = `<div class="result ${ok ? "ok" : "bad"}">
            <h4>${ok ? "متن کامل است" : "هنوز کامل نیست"}</h4>
            <p>${inRange ? "طول متن مناسب است." : "طول متن باید بین " + it.minWords + " و " + it.maxWords + " کلمه باشد. الان " + n + " کلمه داری."}
            ${checked === it.checklist.length ? "" : "همه‌ی موارد چک‌لیست را بررسی کن."}</p>
            <p>${it.analysis}</p>${studyBlock(it)}</div>`;
        });
        body.appendChild(btn);
      }
    });
  }

  function renderVocab() {
    const box = $("#vocab");
    box.innerHTML = (P.vocab[current] || []).map((v) =>
      `<div><b>${v.es}</b>${v.fa}<br><span class="muted">${v.topic}</span></div>`).join("");
  }

  renderLevels();
  renderItems();
  renderVocab();
</script>
<nav class="tabbar" aria-label="منوی پایین"><a href="index.html">خانه</a><a href="memory.html">مرور</a><a href="practice.html" aria-current="page">تمرین</a><a href="exams.html">امتحان</a></nav>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
