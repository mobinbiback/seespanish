<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1E26">
<link rel="manifest" href="manifest.json">
<title>seespanish · برنامه‌ی امروز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
    --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--body); line-height: 1.8; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 110px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 16px; }
  .logo { font-family: "Caveat", cursive; font-size: 2.2rem; margin: 0; }
  .logo span.fx-spotlight { font: 800 2rem/1.2 "JetBrains Mono", "Nunito", monospace; }
  h2 { font-family: var(--head); font-size: 1.5rem; margin: 22px 0 8px; }
  .muted { color: var(--graphite-soft); font-size: .95rem; }
  .segment {
    display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); list-style: none; margin: 0 0 14px;
  }
  .segment li { flex: 1 1 0; }
  .segment button {
    width: 100%; min-height: 40px; border: 0; border-radius: 999px; background: transparent;
    color: var(--graphite-soft); font: inherit; font-size: 1rem; cursor: pointer;
  }
  .segment button[aria-pressed="true"] { background: var(--pencil); color: var(--accent-ink); font-weight: 800; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow); padding: 16px 18px; margin-bottom: 12px;
    display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start;
  }
  .card h3 { font-family: var(--head); font-size: 1.15rem; margin: 0 0 2px; }
  .card p { margin: 0; color: var(--graphite-soft); font-size: .92rem; }
  .step-no {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--paper-2); font-weight: 800; color: var(--graphite);
  }
  .card.done .step-no { background: var(--ok); }
  .go {
    display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--pencil); color: var(--accent-ink); font-weight: 800; text-decoration: none; font-size: .95rem;
  }
  .tick {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--surface); cursor: pointer; font-size: 1rem; color: var(--graphite);
  }
  .card.done .tick { background: var(--pencil); border-color: transparent; color: var(--accent-ink); }
  .total { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 10px; font-size: .95rem; }
  .bar { height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin-bottom: 14px; }
  .bar i { display: block; height: 100%; background: var(--pencil); transition: width .3s ease; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: none; justify-content: space-around; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px;
    box-shadow: 0 10px 30px var(--shadow); z-index: 50; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--graphite-soft);
    text-decoration: none; padding: 6px 2px; min-height: 52px; border-radius: 16px; }
  .tabbar a[aria-current="page"] { color: var(--graphite); font-weight: 800; }
  .tabbar a[aria-current="page"]::before { content: ""; width: 26px; height: 4px; border-radius: 999px; background: var(--pencil); margin-bottom: 4px; }
  @media (max-width: 640px) { .tabbar { display: flex; } }
</style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><span class="fx-spotlight">See Spanish</span></h1>
  </header>

  <h2>برنامه‌ی امروز</h2>
  <p class="muted">مدت وقتت را انتخاب کن تا مراحل امروز را ببینی.</p>
  <ul class="segment" id="minutes" role="group" aria-label="مدت مطالعه"></ul>
  <ul class="segment" id="levels" role="group" aria-label="سطح"></ul>

  <div class="total"><span>پیشرفت امروز</span><span id="count"></span></div>
  <div class="bar"><i id="barFill" style="width:0"></i></div>

  <div id="steps"></div>
  <p class="muted" id="note"></p>
</div>

<nav class="tabbar" aria-label="منوی پایین"><a href="index.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>خانه</span></a><a href="plan.html" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>برنامه</span></a><a href="practice.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>تمرین</span></a><a href="notebook.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 4v16"/></svg><span>دفترچه</span></a><a href="me.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>من</span></a></nav>

<script src="data/data.js"></script>
<script src="data/explain.js"></script>
<script src="data/progress.js"></script>
<script src="data/practice.js"></script>
<script src="data/practice-extra.js"></script>
<script src="data/practice-b1.js"></script>
<script src="data/practice-b2.js"></script>
<script src="data/practice-more.js"></script>
<script src="data/practice-expand.js"></script>
<script src="data/vocab-more.js"></script>
<script src="data/vocab-b1.js"></script>
<script src="data/vocab-b2.js"></script>
<script src="data/vocab-c1.js"></script>
<script src="data/vocab-c2.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
  const MINUTES = [15, 30, 45, 60];
  const TODAY_KEY = "seespanish:today:v1";
  const PREF_KEY = "seespanish:plan:pref";
  const SEE_GRAMMAR_LEVEL = () => window.SEE.grammar;

  let pref = { level: "A1", minutes: 30 };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) { /* ignore */ }

  function savePref() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { /* ignore */ }
  }

  // وضعیت تیک‌ها برای امروز؛ اگر روز عوض شود، از نو شروع می‌شود
  function todayState() {
    const day = new Date().toISOString().slice(0, 10);
    let st = {};
    try { st = JSON.parse(localStorage.getItem(TODAY_KEY)) || {}; } catch (e) { st = {}; }
    if (st.day !== day) st = { day, done: {} };
    return st;
  }
  function saveToday(st) {
    try { localStorage.setItem(TODAY_KEY, JSON.stringify(st)); } catch (e) { /* ignore */ }
  }

  function buildSteps() {
    const plan = window.SEE_PROGRESS.dailyPlan(pref.level);
    const steps = [];
    steps.push({
      id: "cards", title: "مرور واژگان", min: 5,
      text: plan.words.length ? `${plan.words.length} واژه برای مرور: ${plan.words.join("، ")}` : "امروز کارتی برای مرور نداری.",
      href: "memory.html"
    });
    if (plan.grammar) {
      steps.push({
        id: "grammar", title: "یک گرامر تازه", min: 5,
        text: plan.grammar.title, href: "index.html"
      });
    }
    if (plan.exercise) {
      const weak = window.SEE_PROGRESS.weakIds().length > 0;
      steps.push({
        id: "exercise", title: weak ? "تمرین نقاط ضعف" : "یک تمرین", min: 5,
        text: "یک سؤال را حل کن و توضیحش را بخوان.",
        href: "practice.html" + (weak ? "?weak=1" : "")
      });
    }
    if (pref.minutes >= 30) {
      steps.push({
        id: "listen", title: "درک شنیداری", min: 5,
        text: "یک متن را گوش کن و به سؤال‌هایش جواب بده.", href: "listening.html"
      });
    }
    // بر اساس مدت انتخابی، مراحل زیاد را کنار می‌گذاریم
    let total = 0;
    return steps.filter((s) => {
      if (total + s.min <= pref.minutes + 5) { total += s.min; return true; }
      return false;
    });
  }

  function lvlOpen(l) {
    if (!(window.SEE_PROGRESS && typeof window.SEE_PROGRESS.levelOpen === "function")) return true;
    return window.SEE_PROGRESS.levelOpen(l);
  }
  function lvlLockMsg(l) {
    if (window.SEE_PROGRESS && typeof window.SEE_PROGRESS.lockMessage === "function") return window.SEE_PROGRESS.lockMessage(l);
    return "";
  }
  function renderSegments() {
    const m = $("#minutes"); m.innerHTML = "";
    MINUTES.forEach((v) => {
      const li = document.createElement("li"); const b = document.createElement("button");
      b.type = "button"; b.textContent = v + " دقیقه";
      b.setAttribute("aria-pressed", String(v === pref.minutes));
      b.addEventListener("click", () => { pref.minutes = v; savePref(); render(); });
      li.appendChild(b); m.appendChild(li);
    });
    const l = $("#levels"); l.innerHTML = "";
    LEVELS.forEach((v) => {
      const li = document.createElement("li"); const b = document.createElement("button");
      b.type = "button"; b.textContent = v;
      b.setAttribute("aria-pressed", String(v === pref.level));
      b.addEventListener("click", () => {
        if (!lvlOpen(v)) { window.alert(lvlLockMsg(v)); return; }
        pref.level = v; savePref(); render();
      });
      li.appendChild(b); l.appendChild(li);
    });
  }

  function render() {
    renderSegments();
    const steps = buildSteps();
    const st = todayState();
    const box = $("#steps"); box.innerHTML = "";
    let doneCount = 0;

    steps.forEach((s, i) => {
      const done = !!st.done[s.id];
      if (done) doneCount++;
      const card = document.createElement("div");
      card.className = "card" + (done ? " done" : "");

      const no = document.createElement("div");
      no.className = "step-no"; no.textContent = String(i + 1);

      const body = document.createElement("div");
      const h = document.createElement("h3"); h.textContent = `${s.title} · ${s.min} دقیقه`;
      const p = document.createElement("p"); p.dir = "auto"; p.textContent = s.text;
      const a = document.createElement("a"); a.className = "go"; a.href = s.href; a.textContent = "شروع";
      body.append(h, p, a);

      const tick = document.createElement("button");
      tick.type = "button"; tick.className = "tick";
      tick.setAttribute("aria-label", done ? "برگرداندن" : "انجام شد");
      tick.textContent = done ? "✓" : "";
      tick.addEventListener("click", () => {
        const cur = todayState();
        cur.done[s.id] = !cur.done[s.id];
        saveToday(cur);
        render();
      });

      card.append(no, body, tick);
      box.appendChild(card);
    });

    const pct = steps.length ? Math.round((doneCount / steps.length) * 100) : 0;
    $("#count").textContent = `${doneCount} از ${steps.length}`;
    $("#barFill").style.width = pct + "%";
    $("#note").textContent = pref.minutes >= 60
      ? "برای ۶۰ دقیقه، بعد از انجام مراحل بالا، تمرین بیشتری از همین سطح حل کن."
      : "هر مرحله که انجام شد، تیک بزن. فردا برنامه‌ی تازه‌ای برات ساخته می‌شود.";
  }

  render();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
