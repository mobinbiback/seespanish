<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1E26">
<link rel="manifest" href="manifest.json">
<title>seespanish · برنامه‌ی امروز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
    --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--body); line-height: 1.8; }
  .logo { font-family: "Caveat", cursive; font-size: 2rem; margin: 0; }
  .logo span.fx-spotlight { font: 800 1.8rem/1.2 "JetBrains Mono", "Nunito", monospace; }

  .plan { max-width: 720px; margin: 0 auto; padding: 0 18px 130px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 6px; flex-wrap: wrap; }
  .top-tools { display: flex; gap: 8px; align-items: center; }
  .ico-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 var(--edge, #CFC6AE); display: grid; place-items: center; text-decoration: none; }
  .ico-btn.on { background: var(--pencil); border-color: transparent; box-shadow: 0 4px 0 #B98F12; }

  .sum-title { font-family: var(--head); font-size: 1.5rem; margin: 12px 0 2px; color: var(--graphite); }
  .sum-sub { color: var(--graphite-soft); font-size: 13px; margin: 0 0 10px; }
  .meter { height: 14px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--pencil), #B98F12); border-radius: 999px; transition: width .4s; }

  /* کارت بعدی */
  .next {
    margin: 16px 0; border-radius: 24px; padding: 18px; background: var(--surface); border: 2px solid #B98F12;
    box-shadow: 0 7px 0 #B98F12, 0 14px 26px var(--shadow);
  }
  .next-head { display: flex; align-items: center; gap: 12px; }
  .next-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; background: rgba(242,194,48,.18); flex: 0 0 auto; }
  .next-tag { font-size: 12px; color: var(--graphite-soft); font-weight: 800; }
  .next-title { font-family: var(--head); font-size: 1.1rem; color: var(--graphite); margin: 2px 0 0; line-height: 1.6; }
  .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; margin-top: 14px; border: 0; border-radius: 18px; background: #FD7F52; color: #FFFFFD; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 #B4431B; text-decoration: none; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #B4431B; }
  .skip { display: block; text-align: center; margin-top: 12px; color: var(--graphite-soft); font-size: 13px; background: none; border: 0; font: inherit; cursor: pointer; width: 100%; }

  /* فهرست کارهای امروز */
  .sec-title { font-family: var(--head); font-size: 1.02rem; margin: 22px 0 10px; color: var(--graphite); display: flex; align-items: center; gap: 8px; }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tasks { display: grid; gap: 10px; }
  .task {
    display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 0 var(--edge, #CFC6AE); cursor: pointer; text-align: right; font: inherit; color: var(--graphite); width: 100%;
  }
  .task-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; background: var(--paper-2); border: 1px solid var(--line); }
  .task b { display: block; font-size: 14px; line-height: 1.6; }
  .task small { color: var(--graphite-soft); font-size: 11.5px; }
  .task-check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; color: transparent; }
  .task.done { border-color: #3F6B0A; }
  .task.done .task-check { background: #B3D93B; border-color: transparent; color: #1B1530; }
  .task.done b { text-decoration: line-through; color: var(--graphite-soft); }

  /* مدت روزانه */
  .pref { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .pref span { color: var(--graphite-soft); font-size: 13px; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); }
  .seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--graphite-soft); font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--pencil); color: var(--accent-ink); }

  /* تمرین بیشتر */
  .more { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile {
    display: grid; gap: 8px; padding: 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 5px 0 var(--edge, #CFC6AE); text-decoration: none; color: var(--graphite); min-height: 110px; align-content: start;
  }
  .tile .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--paper-2); border: 1px solid var(--line); }
  .tile b { font-size: 14px; }
  .tile small { color: var(--graphite-soft); font-size: 11.5px; line-height: 1.7; }

  .tabbar { position: fixed; bottom: 0; left: 12px; right: 12px; display: none; justify-content: space-around; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 10px 30px var(--shadow); z-index: 50; bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--graphite-soft); text-decoration: none; padding: 6px 2px; min-height: 52px; border-radius: 16px; }
  .tabbar a[aria-current="page"] { color: var(--graphite); font-weight: 800; }
  .tabbar a[aria-current="page"]::before { content: ""; width: 26px; height: 4px; border-radius: 999px; background: var(--pencil); margin-bottom: 4px; }
  @media (max-width: 640px) { .tabbar { display: flex; } body { padding-bottom: 60px; } header nav.top-nav { display: none !important; } }
</style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
<script src="js/prefs.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/gamify.js"></script>
<script src="js/sync.js"></script>
<script src="js/i18n.js"></script>
<script src="data/i18n-content.js"></script>
<script src="data/i18n-content-grammar.js"></script>
<script src="data/i18n-vocab-a1.js"></script>
</head>
<body>
<div class="plan">
  <header class="top">
    <h1 class="logo"><span class="fx-spotlight">See Spanish</span></h1>
    <div class="top-tools">
      <button class="ico-btn" id="soundBtn" type="button" aria-label="صدا">🔊</button>
      <a class="ico-btn" href="me.html" aria-label="من">👤</a>
    </div>
  </header>

  <h2 class="sum-title" id="sumTitle">امروز</h2>
  <p class="sum-sub" id="sumSub"></p>
  <div class="meter"><i id="meterBar" style="width:0%"></i></div>

  <section class="next" id="next">
    <div class="next-head">
      <div class="next-ico" aria-hidden="true">📘</div>
      <div>
        <div class="next-tag" id="nextTag">بعدی</div>
        <div class="next-title" id="nextTitle"></div>
      </div>
    </div>
    <a class="go" id="nextGo" href="index.html">شروع <span aria-hidden="true">←</span></a>
    <button class="skip" id="skipBtn" type="button">امروز را رد کن</button>
  </section>

  <div class="sec-title">کارهای امروز</div>
  <div class="tasks" id="tasks"></div>

  <div class="pref">
    <span id="prefText"></span>
    <div class="seg" id="durSeg" role="group" aria-label="مدت">
      <button type="button" data-min="15">۱۵</button>
      <button type="button" data-min="30">۳۰</button>
      <button type="button" data-min="45">۴۵</button>
      <button type="button" data-min="60">۶۰</button>
    </div>
  </div>

  <div class="sec-title">تمرین بیشتر</div>
  <div class="more">
    <a class="tile" href="memory.html"><span class="ti">🗂️</span><b>کارت‌های واژه</b><small>مرور واژه‌ها با کارت</small></a>
    <a class="tile" href="practice.html"><span class="ti">🎯</span><b>نقاط ضعف</b><small>سؤال‌هایی که اشتباه زدی</small></a>
    <a class="tile" href="listening.html"><span class="ti">🎧</span><b>درک شنیداری</b><small>گوش کن و جواب بده</small></a>
    <a class="tile" href="test.html"><span class="ti">🏅</span><b>آزمون پایان سطح</b><small>قبولی باز می‌کند سطح بعدی را</small></a>
  </div>
</div>

<nav class="tabbar" aria-label="منوی پایین">
  <a href="index.html"><span>🏠</span><span>خانه</span></a>
  <a href="plan.html" aria-current="page"><span>📅</span><span>برنامه</span></a>
  <a href="practice.html"><span>🎯</span><span>تمرین</span></a>
  <a href="notebook.html"><span>📓</span><span>دفترچه</span></a>
  <a href="me.html"><span>👤</span><span>من</span></a>
</nav>

<script src="data/practice-b2.js"></script>
<script src="data/practice-more.js"></script>
<script src="data/practice-expand.js"></script>
<script src="data/practice-expand2.js"></script>
<script src="data/practice-expand3.js"></script>
<script src="data/vocab-more.js"></script>
<script src="data/vocab-b1.js"></script>
<script src="data/vocab-b2.js"></script>
<script src="data/vocab-c1.js"></script>
<script src="data/vocab-c2.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PK = "seespanish:progress:v2";
  var TODAY_KEY = "seespanish:today:v1";
  var PREF_KEY = "seespanish:plan:pref";
  var level = "A1";
  try { level = localStorage.getItem("seespanish:level") || "A1"; } catch (e) {}
  function tt(key, vars) { return window.SEE_I18N ? SEE_I18N.t(key, vars) : key; }
  function tr(obj, f) { return window.SEE_I18N ? SEE_I18N.tx(obj, f) : obj[f]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function loadP() { try { return JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) { return {}; } }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function loadToday() {
    var t = {}; try { t = JSON.parse(localStorage.getItem(TODAY_KEY)) || {}; } catch (e) {}
    if (t.day !== todayStr()) t = { day: todayStr(), done: {}, skipped: false };
    return t;
  }
  function saveToday(t) { try { localStorage.setItem(TODAY_KEY, JSON.stringify(t)); } catch (e) {} }
  function minutes() { try { return Number(localStorage.getItem(PREF_KEY)) || 30; } catch (e) { return 30; } }

  // ---------- درس بعدی ----------
  function nextLesson() {
    var p = loadP();
    var items = (window.SEE && SEE.grammar && SEE.grammar[level]) || [];
    return items.filter(function (it) { return !p[it.id + "|path"]; })[0] || null;
  }

  // ---------- کارهای امروز ----------
  function buildTasks() {
    var nx = nextLesson();
    var list = [];
    list.push({ id: "lesson", ico: "📘", title: nx ? tt("درس") + ": " + tr(nx, "title") : tt("همه‌ی درس‌های این سطح تمام شد"), min: 17, href: "index.html", needs: !!nx });
    list.push({ id: "flash", ico: "🗂️", title: tt("مرور واژگان"), min: 5, href: "memory.html" });
    list.push({ id: "weak", ico: "🎯", title: tt("تمرین نقاط ضعف"), min: 5, href: "practice.html" });
    list.push({ id: "listen", ico: "🎧", title: tt("درک شنیداری"), min: 8, href: "listening.html" });
    return list;
  }

  function render() {
    var t = loadToday();
    var tasks = buildTasks();
    var doneCount = tasks.filter(function (x) { return t.done[x.id]; }).length;
    var pending = tasks.filter(function (x) { return !t.done[x.id]; });
    var left = pending.reduce(function (s, x) { return s + x.min; }, 0);
    var pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;

    $("sumSub").textContent = doneCount + " " + tt("از") + " " + tasks.length + " " + tt("انجام شد") + " · " + tt("حدود") + " " + left + " " + tt("دقیقه مانده");
    $("meterBar").style.width = pct + "%";

    // کارت بعدی
    var first = pending[0];
    if (t.skipped || !first) {
      $("nextTag").textContent = t.skipped ? tt("امروز را رد کردی") : tt("امروز تمام شد");
      $("nextTitle").textContent = t.skipped ? tt("فردا دوباره برنامه داری.") : tt("عالی! کارهای امروز کامل شد.");
      $("nextGo").href = "index.html"; $("nextGo").innerHTML = tt("صفحه‌ی خانه") + ' <span aria-hidden="true">←</span>';
      $("skipBtn").hidden = true;
    } else {
      $("nextTag").textContent = tt("بعدی") + " · " + first.min + " " + tt("دقیقه");
      $("nextTitle").textContent = first.title;
      $("nextGo").href = first.href;
      $("nextGo").innerHTML = tt("شروع") + ' <span aria-hidden="true">←</span>';
      $("skipBtn").hidden = false;
    }

    // فهرست کارها
    $("tasks").innerHTML = tasks.map(function (x) {
      var d = !!t.done[x.id];
      return '<button class="task ' + (d ? "done" : "") + '" type="button" data-task="' + x.id + '">' +
        '<span class="task-ico" aria-hidden="true">' + x.ico + '</span>' +
        '<span><b>' + esc(x.title) + '</b><small>' + x.min + ' ' + esc(tt("دقیقه")) + '</small></span>' +
        '<span class="task-check" aria-hidden="true">✓</span></button>';
    }).join("");

    $("prefText").textContent = minutes() + " " + tt("دقیقه در روز") + " · " + level;
    Array.prototype.forEach.call($("durSeg").children, function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.min) === minutes()));
    });
    if (window.SEE_I18N) SEE_I18N.apply();
  }

  $("tasks").addEventListener("click", function (e) {
    var b = e.target.closest("[data-task]");
    if (!b) return;
    var t = loadToday();
    var id = b.getAttribute("data-task");
    var wasDone = !!t.done[id];
    t.done[id] = !wasDone;
    saveToday(t);
    if (!wasDone && window.SEE_FX) SEE_FX.result(true, b);
    render();
  });

  $("skipBtn").addEventListener("click", function () {
    var t = loadToday(); t.skipped = true; saveToday(t); render();
  });

  Array.prototype.forEach.call($("durSeg").children, function (b) {
    b.addEventListener("click", function () {
      try { localStorage.setItem(PREF_KEY, b.dataset.min); } catch (e) {}
      render();
    });
  });

  var sb = $("soundBtn");
  function paintSound() { var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true; sb.classList.toggle("on", on); sb.textContent = on ? "🔊" : "🔇"; }
  sb.addEventListener("click", function () { var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true; if (window.SEE_PREFS) SEE_PREFS.setSound(!on); paintSound(); });
  paintSound();

  $("sumTitle").textContent = tt("امروز");
  render();
  document.addEventListener("see:answer", render);
  document.addEventListener("DOMContentLoaded", render);
  if (window.SEE_I18N) setTimeout(SEE_I18N.apply, 600);
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
