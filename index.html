<style>
  :root {
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
    --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--body); line-height: 1.8; }
  .logo { font-family: "Caveat", cursive; font-size: 2.2rem; margin: 0; }
  .logo span.fx-spotlight { font: 800 2rem/1.2 "JetBrains Mono", "Nunito", monospace; }

  .home { max-width: 760px; margin: 0 auto; padding: 0 18px 130px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 6px; flex-wrap: wrap; }
  .top-tools { display: flex; gap: 8px; align-items: center; }
  .ico-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 var(--edge, #CFC6AE); display: grid; place-items: center; text-decoration: none; }
  .ico-btn.on { background: var(--pencil); border-color: transparent; box-shadow: 0 4px 0 #B98F12; }

  /* سطح‌ها */
  .levels { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; overflow-x: auto; padding-bottom: 4px; }
  .levels .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--graphite-soft); margin-left: 4px; white-space: nowrap; }
  .lvl-pill { min-width: 52px; height: 46px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--edge, #CFC6AE); white-space: nowrap; }
  .lvl-pill[aria-pressed="true"] { background: var(--pencil); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 #B98F12; }
  .lvl-pill[aria-disabled="true"] { opacity: .5; }

  /* کارت شروع */
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 18px; color: #FFFFFD;
    background: linear-gradient(135deg, #6200BE 0%, #4F00A0 60%, #2E0A66 100%);
    box-shadow: 0 8px 0 #2E0A66, 0 16px 30px rgba(98,0,190,.25); margin-bottom: 16px;
  }
  .hero::after { content: ""; position: absolute; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,189,65,.2); left: -56px; bottom: -74px; }
  .hero-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .6px; padding: 3px 10px; border-radius: 999px; background: #FFBD41; color: #2E0A66; }
  .hero h2 { font-family: var(--head); font-size: 1.3rem; margin: 10px 0 4px; position: relative; z-index: 1; }
  .hero p { margin: 0 0 14px; opacity: .92; font-size: 13px; position: relative; z-index: 1; }
  .hero .go { position: relative; z-index: 1; min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: #FFBD41; color: #2E0A66; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #B98F12; }

  /* کارت‌ها */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 6px 0 var(--edge, #CFC6AE), 0 10px 24px var(--shadow); margin-bottom: 14px; }
  .card-title { font-family: var(--head); font-size: 1.02rem; margin: 0 0 6px; color: var(--graphite); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title a { font-size: 12px; color: var(--graphite-soft); text-decoration: none; font-weight: 700; }
  .muted { color: var(--graphite-soft); font-size: 12.5px; line-height: 1.9; margin: 0; }
  .bar-row { display: grid; grid-template-columns: 52px 1fr 60px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--graphite-soft); margin-top: 7px; }
  .bar { height: 9px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--pencil); border-radius: 999px; transition: width .4s; }

  /* کتاب‌ها */
  .sec-title { font-family: var(--head); font-size: 1.05rem; margin: 22px 0 10px; color: var(--graphite); display: flex; align-items: center; gap: 8px; }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .book { text-align: right; cursor: pointer; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; box-shadow: 0 5px 0 var(--edge, #CFC6AE); font: inherit; color: var(--graphite); display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; }
  .book[aria-pressed="true"] { border-color: var(--pencil); box-shadow: 0 5px 0 #B98F12; }
  .book-cover { width: 58px; height: 70px; border-radius: 12px; display: grid; place-items: center; color: #FFFFFD; font-weight: 800; font-size: 13px; letter-spacing: .3px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }
  .book b { display: block; font-size: 14px; line-height: 1.5; }
  .book small { color: var(--graphite-soft); font-size: 11.5px; }
  .book .bar { margin-top: 8px; }
  .empty { color: var(--graphite-soft); font-size: 13px; padding: 14px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; }

  /* مسیر یادگیری */
  .path-wrap { margin-top: 16px; }
  .path-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .path-head b { font-family: var(--head); font-size: 1.02rem; }
  .path { display: grid; justify-items: center; gap: 14px; padding: 8px 0 4px; }
  .node {
    position: relative; width: 66px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--surface); color: var(--graphite); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--edge, #CFC6AE);
    display: grid; place-items: center;
  }
  .node.done { background: #B3D93B; color: #1B1530; border-color: transparent; box-shadow: 0 6px 0 #6F9A12; }
  .node.next { background: var(--pencil); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 0 #B98F12; }
  .node.locked { opacity: .45; }
  .node:active { transform: translateY(3px); }
  .node-label { font-size: 12px; color: var(--graphite-soft); text-align: center; max-width: 220px; line-height: 1.6; }
  .path .zig { margin-right: 60px; }
  .path .zig-l { margin-left: 60px; }

  .detail { margin-top: 14px; }
  .detail h3 { font-family: var(--head); font-size: 1.02rem; margin: 0 0 6px; }
  .detail pre { white-space: pre-wrap; font-family: var(--body); font-size: 13px; line-height: 1.9; background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 8px 0; color: var(--graphite); }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--edge, #CFC6AE); }
  .btn.main { background: var(--pencil); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 0 #B98F12; }
  .btn:active { transform: translateY(2px); }

  .search { width: 100%; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; box-sizing: border-box; margin-top: 8px; }
  .results { margin-top: 10px; }
  .result { display: block; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; color: var(--graphite); text-decoration: none; font-size: 13.5px; }

  .tabbar { position: fixed; bottom: 0; left: 12px; right: 12px; display: none; justify-content: space-around; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 10px 30px var(--shadow); z-index: 50; bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--graphite-soft); text-decoration: none; padding: 6px 2px; min-height: 52px; border-radius: 16px; }
  .tabbar a[aria-current="page"] { color: var(--graphite); font-weight: 800; }
  .tabbar a[aria-current="page"]::before { content: ""; width: 26px; height: 4px; border-radius: 999px; background: var(--pencil); margin-bottom: 4px; }
  @media (max-width: 640px) { .tabbar { display: flex; } body { padding-bottom: 60px; } header nav.top-nav { display: none !important; } }
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
  var PK = "seespanish:progress:v2";
  var level = "A1";
  try { level = localStorage.getItem("seespanish:level") || "A1"; } catch (e) {}
  var openBookId = null;
  var pathOpen = true;

  function loadP() { try { return JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) { return {}; } }
  function saveP(p) { try { localStorage.setItem(PK, JSON.stringify(p)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tr(obj, f) { return window.SEE_I18N ? SEE_I18N.tx(obj, f) : obj[f]; }
  function tt(key, vars) { return window.SEE_I18N ? SEE_I18N.t(key, vars) : key; }
  function lvlOpen(l) { return window.SEE_PROGRESS && SEE_PROGRESS.levelOpen ? SEE_PROGRESS.levelOpen(l) : true; }

  // ---------- سطح ----------
  function renderLevels() {
    var box = $("levels");
    box.innerHTML = '<span class="lbl">' + esc(tt("سطح")) + '</span>';
    LEVELS.forEach(function (l) {
      var open = lvlOpen(l);
      var b = document.createElement("button");
      b.type = "button"; b.className = "lvl-pill"; b.textContent = l;
      b.setAttribute("aria-pressed", String(l === level));
      b.setAttribute("aria-disabled", String(!open));
      b.onclick = function () {
        if (!open) { alert(window.SEE_PROGRESS && SEE_PROGRESS.lockMessage ? SEE_PROGRESS.lockMessage(l) : ""); return; }
        level = l; openBookId = null;
        try { localStorage.setItem("seespanish:level", l); } catch (e) {}
        renderAll();
      };
      box.appendChild(b);
    });
  }

  // ---------- کارت شروع ----------
  function renderHero() {
    var items = SEE.grammar[level] || [];
    var p = loadP();
    var next = items.filter(function (it) { return !p[it.id + "|path"]; })[0];
    $("heroTag").textContent = tt("شروع از اینجا");
    if (next) {
      $("heroTitle").textContent = tr(next, "title");
      $("heroText").textContent = level + " · " + (items.length - items.filter(function (it) { return !p[it.id + "|path"]; }).length) + " از " + items.length;
      $("heroGo").onclick = function () { showPath(); showDetail(next); };
    } else {
      $("heroTitle").textContent = level + " کامل شد!";
      $("heroText").textContent = tt("یک سطح بالاتر یا تمرین نقاط ضعف.");
      $("heroGo").onclick = function () { location.href = "practice.html"; };
    }
    $("heroGo").textContent = tt("شروع");
  }

  // ---------- برنامه‌ی امروز ----------
  function renderPlan() {
    if (!(window.SEE_PROGRESS && SEE_PROGRESS.dailyPlan && SEE_PROGRESS.levelProgress)) return;
    var pr = SEE_PROGRESS.levelProgress(level);
    $("planText").textContent = level + " · گرامر، واژه و تمرین";
    var rows = [["گرامر", pr.grammar], ["واژه", pr.vocab], ["تمرین", pr.exercises]];
    $("planBars").innerHTML = rows.map(function (r) {
      var d = r[1]; var pct = d.total ? Math.round(d.done / d.total * 100) : 0;
      return '<div class="bar-row"><span>' + esc(tt(r[0])) + '</span><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + d.done + '/' + d.total + '</span></div>';
    }).join("");
  }

  // ---------- کتاب‌ها ----------
  var COLORS = ["#6200BE", "#FD7F52", "#B3D93B", "#FFBD41", "#4F00A0", "#2E7D6B", "#B4431B", "#3F6B0A"];
  function colorOf(id) { var n = 0; for (var i = 0; i < id.length; i++) n += id.charCodeAt(i); return COLORS[n % COLORS.length]; }
  function bookProgress(book) {
    var u = window.SEE_BOOK_UNITS && SEE_BOOK_UNITS[book.id];
    var p = loadP();
    if (u && u.units) {
      var done = u.units.filter(function (x) { return p["unit|" + book.id + "|" + x.n]; }).length;
      return { done: done, total: u.units.length, src: "unit" };
    }
    var items = (SEE.grammar[level] || []).filter(function (it) { return it.refs && it.refs[book.id]; });
    var d2 = items.filter(function (it) { return p[it.id + "|" + book.id]; }).length;
    return { done: d2, total: items.length, src: "grammar" };
  }
  function renderBooks() {
    var box = $("books");
    var list = (SEE.books || []).filter(function (b) { return b.levels.indexOf(level) >= 0; });
    if (!list.length) { box.innerHTML = '<div class="empty">' + esc(tt("کتابی برای این سطح ثبت نشده.")) + '</div>'; return; }
    box.innerHTML = list.map(function (b) {
      var pr = bookProgress(b); var pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
      var abbr = b.title.split(" ").slice(0, 2).map(function (w) { return w.charAt(0); }).join("").toUpperCase();
      return '<button type="button" class="book" data-book="' + esc(b.id) + '" aria-pressed="' + (openBookId === b.id) + '">' +
        '<span class="book-cover" style="background:' + colorOf(b.id) + '">' + esc(abbr) + '</span>' +
        '<span><b>' + esc(b.title) + '</b><small>' + pr.done + ' از ' + pr.total + (pr.src === "unit" ? ' ' + esc(tt("واحد")) : '') + '</small>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span></span></button>';
    }).join("");
  }
  $("books").addEventListener("click", function (e) {
    var b = e.target.closest("[data-book]");
    if (!b) return;
    openBookId = b.getAttribute("data-book");
    pathOpen = true;
    renderBooks(); showPath();
  });

  // ---------- مسیر (کتاب یا سطح) ----------
  function showPath() { $("pathWrap").hidden = false; pathOpen = true; renderPath(); }
  function renderPath() {
    var wrap = $("pathWrap");
    if (!pathOpen) { $("path").innerHTML = ""; $("detail").hidden = true; $("pathToggle").textContent = tt("نشون بده"); return; }
    $("pathToggle").textContent = tt("پنهان کن");
    var p = loadP();
    var box = $("path");
    if (openBookId) {
      var book = (SEE.books || []).filter(function (b) { return b.id === openBookId; })[0];
      $("pathTitle").textContent = book ? book.title : "";
      var u = window.SEE_BOOK_UNITS && SEE_BOOK_UNITS[openBookId];
      if (u && u.units) {
        var firstOpen = u.units.filter(function (x) { return !p["unit|" + openBookId + "|" + x.n]; })[0];
        box.innerHTML = u.units.map(function (x, i) {
          var done = !!p["unit|" + openBookId + "|" + x.n];
          var cls = done ? "done" : (firstOpen && firstOpen.n === x.n ? "next" : "");
          return '<button class="node ' + cls + ' ' + (i % 2 ? "zig-l" : "zig") + '" type="button" data-unit="' + x.n + '" aria-label="' + esc(tt("واحد")) + ' ' + x.n + '">' + x.n + '</button>' +
            '<div class="node-label">' + esc(x.title) + '</div>';
        }).join("");
        box.onclick = function (e) {
          var b = e.target.closest("[data-unit]");
          if (!b) return;
          var n = Number(b.getAttribute("data-unit"));
          var key = "unit|" + openBookId + "|" + n; var q = loadP();
          q[key] = !q[key]; saveP(q);
          renderBooks(); renderPath(); showUnit(n);
        };
      } else {
        var items = (SEE.grammar[level] || []).filter(function (it) { return it.refs && it.refs[openBookId]; });
        box.innerHTML = items.map(function (it, i) {
          var done = !!p[it.id + "|" + openBookId];
          var cls = done ? "done" : (!items.slice(0, i).every(function (x) { return p[x.id + "|" + openBookId]; }) ? "locked" : "next");
          return '<button class="node ' + cls + ' ' + (i % 2 ? "zig-l" : "zig") + '" type="button" data-item="' + esc(it.id) + '">' + (i + 1) + '</button>' +
            '<div class="node-label">' + esc(tr(it, "title")) + '</div>';
        }).join("") || '<div class="empty">' + esc(tt("این کتاب هنوز مسیر ندارد.")) + '</div>';
        box.onclick = function (e) {
          var b = e.target.closest("[data-item]");
          if (!b) return;
          var it = items.filter(function (x) { return x.id === b.getAttribute("data-item"); })[0];
          if (it) showDetail(it, openBookId);
        };
      }
    } else {
      $("pathTitle").textContent = tt("مسیر") + " " + level;
      var all = SEE.grammar[level] || [];
      box.innerHTML = all.map(function (it, i) {
        var done = !!p[it.id + "|path"];
        var cls = done ? "done" : (!all.slice(0, i).every(function (x) { return p[x.id + "|path"]; }) ? "locked" : "next");
        return '<button class="node ' + cls + ' ' + (i % 2 ? "zig-l" : "zig") + '" type="button" data-item="' + esc(it.id) + '">' + (i + 1) + '</button>' +
          '<div class="node-label">' + esc(tr(it, "title")) + '</div>';
      }).join("");
      box.onclick = function (e) {
        var b = e.target.closest("[data-item]");
        if (!b) return;
        var it = all.filter(function (x) { return x.id === b.getAttribute("data-item"); })[0];
        if (it) showDetail(it, null);
      };
    }
    wrap.hidden = false;
  }

  // ---------- توضیح یک درس ----------
  function showDetail(it, bookId) {
    var d = $("detail");
    var key = it.id + "|" + (bookId || "path");
    var p = loadP();
    var done = !!p[key];
    var text = (window.SEE_EXPLAIN && SEE_EXPLAIN[it.id]) || tr(it, "note") || "";
    d.innerHTML = '<h3>' + esc(tr(it, "title")) + '</h3>' +
      '<pre>' + esc(text) + '</pre>' +
      '<button class="btn main" type="button" id="markBtn">' + esc(done ? tt("برگرداندن") : tt("انجام شد")) + '</button> ' +
      '<a class="btn" href="practice.html">' + esc(tt("تمرین")) + '</a>';
    d.hidden = false;
    $("markBtn").onclick = function () {
      var q = loadP(); q[key] = !q[key]; saveP(q);
      if (window.SEE_FX && !done) SEE_FX.celebrate && SEE_FX.celebrate();
      renderAll(); showDetail(it, bookId);
    };
    if (window.SEE_GAME && !done) SEE_GAME.record(0);
    d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function showUnit(n) {
    var u = window.SEE_BOOK_UNITS && SEE_BOOK_UNITS[openBookId];
    var unit = u && u.units.filter(function (x) { return x.n === n; })[0];
    if (!unit) return;
    var d = $("detail");
    d.innerHTML = '<h3>' + esc(tt("واحد")) + ' ' + n + ' · ' + esc(unit.title) + '</h3>' +
      '<pre>' + esc(unit.topics.join(" · ")) + '</pre>';
    d.hidden = false;
  }

  $("pathToggle").addEventListener("click", function () { pathOpen = !pathOpen; renderPath(); });

  // ---------- جستجو ----------
  $("q").addEventListener("input", function () {
    var q = this.value.trim().toLowerCase();
    var box = $("results");
    if (!q) { box.innerHTML = ""; return; }
    var hits = [];
    LEVELS.forEach(function (l) {
      (SEE.grammar[l] || []).forEach(function (it) {
        var hay = (it.title + " " + (it.note || "") + " " + (window.SEE_CONTENT && SEE_CONTENT[it.id] ? JSON.stringify(SEE_CONTENT[it.id]) : "")).toLowerCase();
        if (hay.indexOf(q) >= 0) hits.push({ it: it, l: l });
      });
    });
    box.innerHTML = hits.slice(0, 20).map(function (h) {
      return '<a class="result" href="notebook.html">' + esc(h.l) + ' · ' + esc(tr(h.it, "title")) + '</a>';
    }).join("") || '<div class="empty">' + esc(tt("موردی پیدا نشد.")) + '</div>';
  });

  // ---------- صدا ----------
  var sb = $("soundBtn");
  function paintSound() {
    var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true;
    sb.classList.toggle("on", on); sb.textContent = on ? "🔊" : "🔇";
  }
  sb.onclick = function () {
    var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true;
    if (window.SEE_PREFS) SEE_PREFS.setSound(!on);
    paintSound();
  };
  paintSound();

  function renderAll() {
    renderLevels(); renderHero(); renderPlan(); renderBooks();
    if (openBookId || pathOpen) { $("pathWrap").hidden = false; renderPath(); } else { $("pathWrap").hidden = true; }
    if (window.SEE_I18N) SEE_I18N.apply();
  }

  renderAll();
  renderPath();
  $("pathWrap").hidden = false;
  if (window.SEE_I18N) { setTimeout(SEE_I18N.apply, 500); }
  document.addEventListener("see:answer", function () { renderAll(); });
  document.addEventListener("DOMContentLoaded", renderAll);
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
