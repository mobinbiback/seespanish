<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>seespanish · تست مربی</title>
<style>
  body { margin: 0; font-family: system-ui, Vazirmatn, sans-serif; background: #111116; color: #F1EEE6; line-height: 1.8; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  h2 { font-size: 1.05rem; margin: 22px 0 6px; }
  p.muted { color: #9D9DAB; font-size: .92rem; }
  button {
    min-height: 44px; padding: 8px 18px; margin: 6px 6px 6px 0; border: 0; border-radius: 999px;
    background: #F2C230; color: #17171E; font: inherit; font-weight: 800; cursor: pointer;
  }
  button.ghost { background: #1C1C25; color: #F1EEE6; border: 1px solid #2A2A35; }
  textarea {
    width: 100%; min-height: 80px; padding: 10px 12px; font: inherit; box-sizing: border-box;
    background: #1C1C25; color: #F1EEE6; border: 1px solid #2A2A35; border-radius: 14px;
  }
  pre {
    direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word;
    background: #1C1C25; border: 1px solid #2A2A35; border-radius: 14px; padding: 14px; font-size: .9rem; min-height: 60px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>تست مربی هوش مصنوعی</h1>
  <p class="muted">اول باید با Google توی صفحه‌ی «من» وارد شده باشی. بعد از تأیید، این صفحه رو حذف کن.</p>

  <h2>۱. تنظیمات و اتصال</h2>
  <button type="button" id="cfg">بررسی تنظیمات</button>
  <button type="button" class="ghost" id="live">تست زنده با Gemini</button>
  <button type="button" class="ghost" id="usage">مصرف امروز</button>

  <h2>۲. پرسش از مربی</h2>
  <textarea id="q" placeholder="مثلاً: فرق ser و estar رو با مثال توضیح بده"></textarea>
  <button type="button" id="ask">بپرس</button>

  <pre id="out">آماده‌ست. یکی از دکمه‌ها رو بزن.</pre>
</div>
<script>
  (function () {
    var API = "https://seespanish-api.sub-ify.site/index.php";
    var out = document.getElementById("out");
    function token() {
      try { return localStorage.getItem("seespanish:token"); } catch (e) { return null; }
    }
    function show(label, promise) {
      var t = token();
      if (!t) { out.textContent = "توکن ورود پیدا نشد. اول توی صفحه‌ی «من» با Google وارد شو."; return; }
      out.textContent = "در حال انجام...";
      promise(t)
        .then(function (r) { return r.text().then(function (txt) { return label + "\nHTTP " + r.status + "\n" + txt; }); })
        .then(function (txt) { out.textContent = txt; })
        .catch(function (e) { out.textContent = "خطای شبکه: " + e.message; });
    }
    function get(path) {
      return function (t) { return fetch(API + path, { headers: { "Authorization": "Bearer " + t } }); };
    }
    document.getElementById("cfg").onclick = function () { show("config", get("/ai/ping")); };
    document.getElementById("live").onclick = function () { show("live", get("/ai/ping?live=1")); };
    document.getElementById("usage").onclick = function () { show("usage", get("/ai/usage")); };
    document.getElementById("ask").onclick = function () {
      var q = document.getElementById("q").value.trim();
      if (!q) { out.textContent = "اول یه سؤال بنویس."; return; }
      show("tutor", function (t) {
        return fetch(API + "/ai/tutor", {
          method: "POST",
          headers: { "Authorization": "Bearer " + t, "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
      });
    };
  })();
</script>
</body>
</html>
