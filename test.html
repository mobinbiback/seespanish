<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1E26">

<title>seespanish · آزمون سطح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
    --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--body); line-height: 1.8; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 110px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 16px; }
  .logo { font-family: "Caveat", cursive; font-size: 2.2rem; margin: 0; }
  .logo span.fx-spotlight { font: 800 2rem/1.2 "JetBrains Mono", "Nunito", monospace; }
  h2 { font-family: var(--head); font-size: 1.5rem; margin: 18px 0 6px; }
  .muted { color: var(--graphite-soft); font-size: .95rem; }
  .q {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow); padding: 16px 18px; margin-bottom: 14px;
  }
  .q .prompt { direction: ltr; text-align: left; font-family: "Nunito", system-ui, sans-serif; font-size: 1rem; margin-bottom: 8px; }
  .q .prompt small { display: block; color: var(--graphite-soft); direction: rtl; text-align: right; }
  .opts { list-style: none; padding: 0; margin: 0; }
  .opts li { margin: 6px 0; }
  .opts label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; direction: ltr; text-align: left; font-family: "Nunito", system-ui, sans-serif; }
  input[type="text"] {
    width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; direction: ltr; text-align: left;
    background: var(--surface); color: var(--graphite); border: 1px solid var(--line); border-radius: 14px;
  }
  .btn {
    display: inline-block; min-height: 44px; padding: 8px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--pencil); color: var(--accent-ink); font: inherit; font-weight: 800; font-size: 1.05rem; margin-top: 10px;
  }
  .btn.ghost { background: var(--surface); color: var(--graphite); border: 1px solid var(--line); }
  .result { border-radius: 18px; padding: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 8px 24px var(--shadow); margin-top: 14px; }
  .result.pass { background: var(--ok); }
  .result.fail { background: var(--bad); }
  .result h3 { font-family: var(--head); font-size: 1.4rem; margin: 0 0 4px; }
  .fix { font-size: .92rem; margin: 6px 0 0; direction: rtl; }
  .fix b { direction: ltr; display: inline-block; font-family: "Nunito", system-ui, sans-serif; }
  .lock {
    background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; padding: 20px; margin-top: 16px;
  }
  .tabbar { position: fixed; bottom: 0; left: 12px; right: 12px; display: none; justify-content: space-around; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px;
    box-shadow: 0 10px 30px var(--shadow); z-index: 50; bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--graphite-soft);
    text-decoration: none; padding: 6px 2px; min-height: 52px; border-radius: 16px; }
  .tabbar a[aria-current="page"] { color: var(--graphite); font-weight: 800; }
  @media (max-width: 640px) { .tabbar { display: flex; } }
</style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><span class="fx-spotlight">See Spanish</span></h1>
  </header>
  <div id="content"></div>
</div>

<nav class="tabbar" aria-label="منوی پایین">

<script src="data/data.js"></script>
<script src="data/progress.js"></script>
<script src="data/practice.js"></script>
<script src="data/practice-extra.js"></script>
<script src="data/practice-b1.js"></script>
<script src="data/practice-b2.js"></script>
<script src="data/practice-more.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const SP = window.SEE_PROGRESS;
  const PASS_RATIO = 0.7;
  const norm = (t) => t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const level = (new URLSearchParams(location.search).get("level") || "A1").toUpperCase();
  const valid = SP.LEVEL_ORDER.includes(level);

  function nextLevel() {
    const i = SP.LEVEL_ORDER.indexOf(level);
    return SP.LEVEL_ORDER[i + 1] || null;
  }

  function renderLocked() {
    $("#content").innerHTML = `
      <h2>آزمون سطح ${level}</h2>
      <div class="lock"><p>${SP.lockMessage(level)}</p>
      <a class="btn ghost" href="test.html?level=${SP.LEVEL_ORDER[SP.LEVEL_ORDER.indexOf(level) - 1]}">رفتن به آزمون سطح قبل</a></div>`;
  }

  function renderTest() {
    const items = window.SEE_PRACTICE.items.filter((i) => i.level === level && (i.type === "mcq" || i.type === "fill"));
    const passed = !!SP.passedLevels()[level];
    const wrap = $("#content");
    wrap.innerHTML = `
      <h2>آزمون سطح ${level}</h2>
      <p class="muted">${items.length} سؤال. برای باز شدن سطح بعد، حداقل ${Math.round(PASS_RATIO * 100)}٪ درست بزن.${passed ? " این سطح قبلاً پاس شده است." : ""}</p>
      <form id="form"></form>
      <div id="out"></div>`;
    const form = $("#form");

    items.forEach((it, idx) => {
      const box = document.createElement("div");
      box.className = "q";
      const p = document.createElement("div");
      p.className = "prompt";
      p.textContent = `${idx + 1}. ${it.question || it.prompt}`;
      box.appendChild(p);
      if (it.question && it.prompt) {
        const sm = document.createElement("small");
        sm.textContent = it.prompt;
        p.appendChild(sm);
      }
      if (it.type === "mcq") {
        const ul = document.createElement("ul"); ul.className = "opts";
        it.options.forEach((o, oi) => {
          const li = document.createElement("li");
          li.innerHTML = `<label><input type="radio" name="q${it.id}" value="${oi}"> <span>${o}</span></label>`;
          ul.appendChild(li);
        });
        box.appendChild(ul);
      } else {
        const inp = document.createElement("input");
        inp.type = "text"; inp.name = "q" + it.id; inp.placeholder = "جواب را بنویس";
        box.appendChild(inp);
      }
      form.appendChild(box);
    });

    const sub = document.createElement("button");
    sub.type = "submit"; sub.className = "btn"; sub.textContent = "ثبت آزمون";
    form.appendChild(sub);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      let right = 0;
      const fixes = [];
      items.forEach((it) => {
        if (it.type === "mcq") {
          const sel = form.querySelector(`input[name="q${it.id}"]:checked`);
          const ok = !!sel && Number(sel.value) === it.answer;
          if (ok) right++; else fixes.push({ q: it.question || it.prompt, a: it.options[it.answer] });
          SP.recordAnswer(it.id, ok);
        } else {
          const val = form.querySelector(`input[name="q${it.id}"]`).value;
          const ok = it.accept.map(norm).includes(norm(val));
          if (ok) right++; else fixes.push({ q: it.prompt, a: it.answer });
          SP.recordAnswer(it.id, ok);
        }
      });
      const ratio = items.length ? right / items.length : 0;
      const pass = ratio >= PASS_RATIO;
      if (pass) SP.setLevelPassed(level);
      showResult(pass, right, items.length, fixes);
    });
  }

  function showResult(pass, right, total, fixes) {
    const out = $("#out");
    const nxt = nextLevel();
    const fixHtml = fixes.map((f) => `<p class="fix">• ${f.q} — جواب درست: <b>${f.a}</b></p>`).join("");
    out.innerHTML = `
      <div class="result ${pass ? "pass" : "fail"}">
        <h3>${pass ? "قبول شدی!" : "هنوز نه، دوباره تلاش کن"}</h3>
        <p>${right} از ${total} درست</p>
        ${pass && nxt ? `<p>سطح ${nxt} الان باز شد.</p><a class="btn" href="index.html">برو به سطح ${nxt}</a>` : ""}
        ${pass && !nxt ? `<p>این آخرین سطح است. تبریک!</p>` : ""}
        ${!pass ? `<p>برای باز شدن سطح بعد، حداقل ${Math.round(PASS_RATIO * 100)}٪ لازم است.</p>` : ""}
        ${fixHtml}
      </div>`;
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  if (!valid) {
    $("#content").innerHTML = `<p class="muted">سطح نامعتبر است.</p>`;
  } else if (!SP.levelOpen(level)) {
    renderLocked();
  } else {
    renderTest();
  }
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
