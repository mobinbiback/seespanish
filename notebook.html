<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1E26">
<link rel="manifest" href="manifest.json">
<title>seespanish · دفترچه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --head: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
    --body: "IRANYekanX", "Vazirmatn", "Nunito", system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--body); line-height: 1.8; }
  .logo { font-family: "Caveat", cursive; font-size: 2rem; margin: 0; }
  .logo span.fx-spotlight { font: 800 1.8rem/1.2 "JetBrains Mono", "Nunito", monospace; }

  .nb { max-width: 720px; margin: 0 auto; padding: 0 18px 130px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 6px; flex-wrap: wrap; }
  .top-tools { display: flex; gap: 8px; align-items: center; }
  .ico-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 var(--edge, #CFC6AE); display: grid; place-items: center; text-decoration: none; }
  .ico-btn.on { background: var(--pencil); border-color: transparent; box-shadow: 0 4px 0 #B98F12; }

  .title { font-family: var(--head); font-size: 1.45rem; margin: 10px 0 2px; color: var(--graphite); }
  .sub { color: var(--graphite-soft); font-size: 13px; margin: 0 0 12px; }

  /* تب‌ها */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tab { min-height: 48px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 var(--edge, #CFC6AE); }
  .tab[aria-selected="true"] { background: var(--pencil); color: var(--accent-ink); border-color: transparent; box-shadow: 0 5px 0 #B98F12; }

  /* چیپ‌ها */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--edge, #CFC6AE); }
  .chip[aria-pressed="true"] { background: var(--pencil); color: var(--accent-ink); border-color: transparent; box-shadow: 0 3px 0 #B98F12; }
  .chip[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .chip-label { font-size: 11px; font-weight: 800; letter-spacing: .8px; color: var(--graphite-soft); margin: 10px 0 4px; display: block; }

  .search { width: 100%; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; box-sizing: border-box; }

  /* کارت‌ها */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: 0 6px 0 var(--edge, #CFC6AE), 0 10px 22px var(--shadow); margin-bottom: 12px; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; background: none; border: 0; font: inherit; color: var(--graphite); width: 100%; text-align: right; padding: 0; }
  .card-h b { font-family: var(--head); font-size: 1.02rem; }
  .card-h small { display: block; color: var(--graphite-soft); font-size: 12px; font-weight: 400; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--pencil); color: var(--accent-ink); white-space: nowrap; }
  .body { margin-top: 12px; }
  .note { color: var(--graphite); font-size: 13px; line-height: 2; white-space: pre-line; background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .ask { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--graphite); font: inherit; font-weight: 700; font-size: 13px; text-decoration: none; box-shadow: 0 3px 0 var(--edge, #CFC6AE); }

  /* جدول صرف */
  .vt { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .vt th { background: var(--pencil); color: var(--accent-ink); font-size: 12.5px; font-weight: 800; padding: 8px; text-align: right; }
  .vt td { padding: 9px 10px; border-top: 1px solid var(--line); font-size: 14px; direction: ltr; text-align: left; }
  .vt td.pn { direction: rtl; text-align: right; color: var(--graphite-soft); font-size: 12.5px; }
  .vt td.sp { width: 44px; text-align: center; }
  .spk { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper-2); cursor: pointer; font-size: 13px; }
  .verb-meta { color: var(--graphite-soft); font-size: 12px; margin: 4px 0 8px; }
  .tense-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

  /* تمرین */
  .drill-q { font-family: "Nunito", system-ui, sans-serif; font-size: 22px; direction: ltr; text-align: left; margin: 12px 0 4px; }
  .drill-q small { display: block; color: var(--graphite-soft); font-family: var(--body); direction: rtl; text-align: right; font-size: 13px; }
  .field { width: 100%; min-height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper-2); color: var(--graphite); font: inherit; font-size: 18px; box-sizing: border-box; direction: ltr; text-align: left; }
  .btn { min-height: 48px; padding: 0 20px; border-radius: 16px; border: 0; background: var(--pencil); color: var(--accent-ink); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #B98F12; margin-top: 10px; }
  .btn.ghost { background: var(--surface); color: var(--graphite); border: 1px solid var(--line); box-shadow: 0 5px 0 var(--edge, #CFC6AE); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #B98F12; }
  .fb { margin-top: 10px; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--line); font-size: 14px; }
  .fb.ok { background: rgba(179,217,59,.18); border-color: #3F6B0A; color: var(--graphite); }
  .fb.bad { background: rgba(253,127,82,.14); border-color: #B4431B; color: var(--graphite); }
  .bar { height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin: 10px 0; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pencil), #B98F12); border-radius: 999px; transition: width .3s; }
  .score { font-family: var(--head); font-size: 1.6rem; text-align: center; margin: 14px 0 4px; color: var(--graphite); }
  .weak { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .weak span { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #B4431B; color: #B4431B; }
  .empty { text-align: center; color: var(--graphite-soft); padding: 22px 0; font-size: 14px; }

  .tabbar { position: fixed; bottom: 0; left: 12px; right: 12px; display: none; justify-content: space-around; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: 0 10px 30px var(--shadow); z-index: 50; bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .78rem; color: var(--graphite-soft); text-decoration: none; padding: 6px 2px; min-height: 52px; border-radius: 16px; }
  .tabbar a[aria-current="page"] { color: var(--graphite); font-weight: 800; }
  .tabbar a[aria-current="page"]::before { content: ""; width: 26px; height: 4px; border-radius: 999px; background: var(--pencil); margin-bottom: 4px; }
  @media (max-width: 640px) { .tabbar { display: flex; } body { padding-bottom: 60px; } header nav.top-nav { display: none !important; } }
</style>

<body>
<div class="nb">
  <header class="top">
    <h1 class="logo"><span class="fx-spotlight">See Spanish</span></h1>
    <div class="top-tools">
      <button class="ico-btn" id="soundBtn" type="button" aria-label="صدا">🔊</button>
      <a class="ico-btn" href="me.html" aria-label="من">👤</a>
    </div>
  </header>

  <h2 class="title" id="title">دفترچه</h2>
  <p class="sub" id="sub">قوانین، افعال و تمرین صرف، همه‌ی سطح‌ها در یک جا.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="rules" aria-selected="true">قوانین</button>
    <button class="tab" role="tab" data-tab="verbs" aria-selected="false">افعال</button>
    <button class="tab" role="tab" data-tab="drill" aria-selected="false">تمرین صرف</button>
  </div>

  <input class="search" id="q" type="search" placeholder="جستجو: ser، subjuntivo، por…" aria-label="جستجو">
  <span class="chip-label">سطح</span>
  <div class="chips" id="levelChips" role="group" aria-label="سطح"></div>

  <section id="rules"></section>

<script src="data/explain-b1.js"></script>
<script src="data/explain-b2.js"></script>
<script src="data/explain-c1.js"></script>
<script src="data/explain-c2.js"></script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
  var TENSES = [["presente", "حال ساده"], ["indefinido", "گذشته‌ی کامل"], ["imperfecto", "گذشته‌ی استمراری"], ["futuro", "آینده"]];
  var PRONS = ["yo", "tú", "él / ella", "nosotros", "vosotros", "ellos / ellas"];
  var IRREG = { ser: 1, estar: 1, tener: 1, ir: 1, hacer: 1, poder: 1, querer: 1, saber: 1, decir: 1, venir: 1, dar: 1, oír: 1 };
  var WEAK_KEY = "seespanish:verbs:weak:v1";
  var tab = "rules", level = "A1", tense = "presente", q = "", drill = null, groups = { ar: 1, er: 1, ir: 1, irreg: 1 };
  try { level = localStorage.getItem("seespanish:level") || "A1"; } catch (e) {}
  function tt(k, v) { return window.SEE_I18N ? SEE_I18N.t(k, v) : k; }
  function tr(o, f) { return window.SEE_I18N ? SEE_I18N.tx(o, f) : o[f]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function norm(t) { return String(t).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " "); }
  function speak(t) { if (window.SEE_PREFS) SEE_PREFS.speak ? SEE_PREFS.speak(t, 0.85) : null; }
  function groupOf(v) { if (IRREG[v.verb]) return "irreg"; var e = v.verb.slice(-2); return e === "ar" ? "ar" : e === "er" ? "er" : "ir"; }
  function weakSet() { try { return new Set(JSON.parse(localStorage.getItem(WEAK_KEY)) || []); } catch (e) { return new Set(); } }
  function saveWeak(s) { try { localStorage.setItem(WEAK_KEY, JSON.stringify([...s])); } catch (e) {} }

  // ---------- سطح‌ها ----------
  function renderLevels() {
    var box = $("levelChips"); box.innerHTML = "";
    LEVELS.forEach(function (l) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = l;
      b.setAttribute("aria-pressed", String(l === level));
      b.onclick = function () { level = l; drill = null; try { localStorage.setItem("seespanish:level", l); } catch (e) {} render(); };
      box.appendChild(b);
    });
  }

  // ---------- قوانین ----------
  function rulesView() {
    var items = (SEE.grammar[level] || []).filter(function (it) {
      if (!q) return true;
      var hay = (tr(it, "title") + " " + tr(it, "note") + " " + ((window.SEE_EXPLAIN && SEE_EXPLAIN[it.id]) || "")).toLowerCase();
      return hay.indexOf(q.toLowerCase()) >= 0;
    });
    if (!items.length) return '<div class="empty">' + esc(tt("موردی پیدا نشد.")) + '</div>';
    return items.map(function (it) {
      var explain = (window.SEE_EXPLAIN && SEE_EXPLAIN[it.id]) || "";
      var stars = "★".repeat(it.stars || 1) + "☆".repeat(3 - (it.stars || 1));
      return '<div class="card"><button class="card-h" type="button" data-rule="' + esc(it.id) + '">' +
        '<span><b>' + esc(tr(it, "title")) + '</b><small>' + esc(tr(it, "note")) + '</small></span>' +
        '<span class="pill">' + stars + '</span></button>' +
        '<div class="body" id="r-' + esc(it.id) + '" hidden>' +
          (explain ? '<div class="note" dir="auto">' + esc(explain) + '</div>' : '') +
          '<a class="ask" href="tutor.html?q=' + encodeURIComponent("این قانون رو با یک مثال ساده برام توضیح بده: " + it.title) + '">✨ ' + esc(tt("از مربی بپرس")) + '</a>' +
        '</div></div>';
    }).join("");
  }

  // ---------- افعال ----------
  function verbsView() {
    var list = (window.SEE_VERBS || []).filter(function (v) {
      if (v.level !== level && level !== "ALL") return false;
      if (q && v.verb.indexOf(q.toLowerCase()) < 0 && v.meaning.indexOf(q) < 0) return false;
      return true;
    });
    var tabs = '<div class="tense-row">' + TENSES.map(function (t) {
      return '<button class="chip" type="button" data-tense="' + t[0] + '" aria-pressed="' + (tense === t[0]) + '">' + esc(tt(t[1])) + '</button>';
    }).join("") + '</div>';
    if (!list.length) return tabs + '<div class="empty">' + esc(tt("فعلی در این سطح پیدا نشد. سطح دیگری را امتحان کن.")) + '</div>';
    return tabs + list.map(function (v) {
      var forms = v.tenses[tense] || [];
      var rows = PRONS.map(function (p, i) {
        return '<tr><td class="pn">' + esc(p) + '</td><td>' + esc(forms[i] || "—") + '</td><td class="sp"><button class="spk" type="button" data-say="' + esc(forms[i] || "") + '" aria-label="پخش">🔊</button></td></tr>';
      }).join("");
      return '<div class="card"><div class="card-h" style="cursor:default"><span><b>' + esc(v.verb) + '</b><small>' + esc(v.meaning) + '</small></span>' +
        '<span class="pill">' + esc(groupOf(v) === "irreg" ? tt("نامنظم") : "-" + groupOf(v)) + '</span></div>' +
        '<div class="body"><table class="vt"><thead><tr><th colspan="3">' + esc(tt(TENSES.find(function (t) { return t[0] === tense; })[1])) + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<button class="ask" type="button" data-say="' + esc(forms.join(", ")) + '">🔊 ' + esc(tt("پخش کل جدول")) + '</button></div></div>';
    }).join("");
  }

  // ---------- تمرین صرف ----------
  function buildPool() {
    var pool = [];
    (window.SEE_VERBS || []).forEach(function (v) {
      if (!groups[groupOf(v)]) return;
      if (drill && drill.level && v.level !== drill.level) return;
      PRONS.forEach(function (p, i) {
        pool.push({ key: v.verb + "|" + drill.tense + "|" + i, verb: v.verb, meaning: v.meaning, pron: p, ans: (v.tenses[drill.tense] || [])[i] || "" });
      });
    });
    return pool.filter(function (x) { return x.ans; });
  }
  function drillView() {
    if (!drill) {
      var sets = ["ar", "er", "ir", "irreg"].map(function (g) {
        return '<button class="chip" type="button" data-group="' + g + '" aria-pressed="' + !!groups[g] + '">' + (g === "irreg" ? tt("نامنظم") : "-" + g) + '</button>';
      }).join("");
      var tenses = TENSES.map(function (t) {
        return '<button class="chip" type="button" data-dtense="' + t[0] + '" aria-pressed="' + (tense === t[0]) + '">' + esc(tt(t[1])) + '</button>';
      }).join("");
      var lvls = '<button class="chip" type="button" data-dlevel="" aria-pressed="' + (!window.drillLevel) + '">' + esc(tt("همه")) + '</button>' +
        LEVELS.map(function (l) { return '<button class="chip" type="button" data-dlevel="' + l + '" aria-pressed="' + (window.drillLevel === l) + '">' + l + '</button>'; }).join("");
      var weakN = weakSet().size;
      return '<div class="card"><b>' + esc(tt("تمرین صرف")) + '</b><p class="sub" style="margin:4px 0 0">' + esc(tt("فرم درست فعل را برای هر ضمیر بنویس؛ ۱۰ سؤال در هر دور.")) + '</p>' +
        '<span class="chip-label">' + esc(tt("گروه فعل")) + '</span><div class="chips">' + sets + '</div>' +
        '<span class="chip-label">' + esc(tt("زمان")) + '</span><div class="chips">' + tenses + '</div>' +
        '<span class="chip-label">' + esc(tt("سطح فعل")) + '</span><div class="chips">' + lvls + '</div>' +
        '<p class="sub">' + esc(tt("فعل‌های ضعیف ذخیره‌شده")) + ': ' + weakN + '</p>' +
        '<button class="btn" type="button" id="dStart">' + esc(tt("شروع ۱۰ سؤال")) + '</button></div>';
    }
    if (drill.i >= drill.items.length) {
      var weak = [...weakSet()].slice(-12);
      return '<div class="card"><div class="score">' + drill.right + ' / ' + drill.items.length + '</div>' +
        '<p class="sub" style="text-align:center">' + esc(tt("پایان دور")) + '</p>' +
        (drill.missed.length ? '<div class="weak">' + drill.missed.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join("") + '</div>' : '') +
        '<button class="btn" type="button" id="dAgain">' + esc(tt("دور تازه")) + '</button> ' +
        '<button class="btn ghost" type="button" id="dBack">' + esc(tt("برگشت")) + '</button></div>';
    }
    var cur = drill.items[drill.i];
    return '<div class="card"><div class="bar"><i style="width:' + Math.round(drill.i / drill.items.length * 100) + '%"></i></div>' +
      '<span class="sub">' + (drill.i + 1) + ' / ' + drill.items.length + ' · ' + esc(cur.verb) + ' (' + esc(cur.meaning) + ')</span>' +
      '<div class="drill-q">' + esc(cur.pron) + '<small>' + esc(tt(TENSES.find(function (t) { return t[0] === drill.tense; })[1])) + '</small></div>' +
      '<input class="field" id="dIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="فرم درست">' +
      '<div><button class="btn" type="button" id="dCheck">' + esc(tt("بررسی جواب")) + '</button> ' +
      '<button class="btn ghost" type="button" id="dListen">🔊 ' + esc(tt("گوش بده")) + '</button></div>' +
      '<div id="dFb"></div></div>';
  }

  function render() {
    $("title").textContent = tt("دفترچه");
    var chipsEl = $("levelChips");
    chipsEl.style.display = tab === "drill" ? "none" : "flex";
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    $("rules").hidden = tab !== "rules"; $("verbs").hidden = tab !== "verbs"; $("drill").hidden = tab !== "drill";
    if (tab === "rules") $("rules").innerHTML = rulesView();
    if (tab === "verbs") $("verbs").innerHTML = verbsView();
    if (tab === "drill") $("drill").innerHTML = drillView();
    renderLevels();
    if (window.SEE_I18N) SEE_I18N.apply();
  }

  // ---------- رویدادها ----------
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { tab = b.dataset.tab; drill = null; render(); });
  });
  $("q").addEventListener("input", function () { q = this.value.trim(); render(); });

  document.addEventListener("click", function (e) {
    var t = e.target;
    var rule = t.closest("[data-rule]");
    if (rule) { var body = $("r-" + rule.getAttribute("data-rule")); if (body) body.hidden = !body.hidden; return; }
    var say = t.closest("[data-say]");
    if (say) { speak(say.getAttribute("data-say")); return; }
    var tense_ = t.closest("[data-tense]");
    if (tense_) { tense = tense_.getAttribute("data-tense"); render(); return; }
    var g = t.closest("[data-group]");
    if (g) { var k = g.getAttribute("data-group"); groups[k] = groups[k] ? 0 : 1; render(); return; }
    var dt = t.closest("[data-dtense]");
    if (dt) { tense = dt.getAttribute("data-dtense"); render(); return; }
    var dl = t.closest("[data-dlevel]");
    if (dl) { window.drillLevel = dl.getAttribute("data-dlevel") || null; render(); return; }
    if (t.id === "dStart") {
      drill = { tense: tense, level: window.drillLevel || null, items: [], i: 0, right: 0, missed: [] };
      var pool = buildPool(); var weak = weakSet();
      var sh = function (a) { return a.sort(function () { return Math.random() - 0.5; }); };
      var wk = sh(pool.filter(function (x) { return weak.has(x.key); })).slice(0, 4);
      drill.items = wk.concat(sh(pool.filter(function (x) { return !weak.has(x.key); }))).slice(0, 10);
      if (!drill.items.length) { drill = null; return; }
      render(); $("dIn") && $("dIn").focus(); return;
    }
    if (t.id === "dAgain") { drill.items = []; drill = Object.assign({}, drill, { i: 0, right: 0, missed: [] }); var p2 = buildPool(); var w2 = weakSet(); var sh2 = function (a) { return a.sort(function () { return Math.random() - 0.5; }); }; drill.items = sh2(p2.filter(function (x) { return w2.has(x.key); })).slice(0, 4).concat(sh2(p2.filter(function (x) { return !w2.has(x.key); }))).slice(0, 10); render(); return; }
    if (t.id === "dBack") { drill = null; render(); return; }
    if (t.id === "dListen") { if (drill) speak(drill.items[drill.i].ans); return; }
    if (t.id === "dCheck") { checkAnswer(); return; }
  });

  function checkAnswer() {
    var inp = $("dIn"); if (!inp || !drill) return;
    var cur = drill.items[drill.i];
    if (!inp.value.trim()) return;
    var ok = norm(inp.value) === norm(cur.ans);
    var weak = weakSet();
    if (ok) { drill.right++; weak.delete(cur.key); } else { weak.add(cur.key); drill.missed.push(cur.verb + ": " + cur.ans); }
    saveWeak(weak);
    if (window.SEE_FX) SEE_FX.result(ok, $("drill"));
    $("dFb").className = "fb " + (ok ? "ok" : "bad");
    $("dFb").innerHTML = ok ? "✓ " + esc(tt("درست بود")) : esc(tt("جواب درست")) + ": <b dir='ltr'>" + esc(cur.ans) + "</b>";
    $("dCheck").textContent = tt("ادامه");
    $("dCheck").id = "dNext";
    $("dNext").onclick = function () { drill.i++; render(); };
    inp.disabled = true;
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && drill && document.activeElement && document.activeElement.id === "dIn") {
      if ($("dNext")) { $("dNext").click(); } else { checkAnswer(); }
    }
  });

  var sb = $("soundBtn");
  function paintSound() { var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true; sb.classList.toggle("on", on); sb.textContent = on ? "🔊" : "🔇"; }
  sb.addEventListener("click", function () { var on = window.SEE_PREFS ? SEE_PREFS.soundOn() : true; if (window.SEE_PREFS) SEE_PREFS.setSound(!on); paintSound(); });
  paintSound();

  render();
  document.addEventListener("DOMContentLoaded", render);
  if (window.SEE_I18N) setTimeout(SEE_I18N.apply, 600);
})();
</script>

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
